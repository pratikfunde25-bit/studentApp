<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | StudentHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="auth-copy">
        <p class="eyebrow">Professional Student Management</p>
        <h1>Secure access for your academic workspace</h1>
        <p class="muted">Manage verified student records, review insights, and work with a cleaner dashboard experience built on Spring Boot best practices.</p>
      </div>

      <div class="auth-card">
        <div class="auth-card-head">
          <h2>Sign in</h2>
          <p>Use the configured administrator account.</p>
        </div>

        <form id="loginForm" onsubmit="login(event)" novalidate>
          <label class="form-label" for="username">Username</label>
          <input id="username" class="form-control form-control-lg" autocomplete="username" placeholder="Enter username" required>

          <label class="form-label mt-3" for="password">Password</label>
          <input id="password" type="password" class="form-control form-control-lg" autocomplete="current-password" placeholder="Enter password" required>

          <p id="loginMessage" class="form-message"></p>
          <button class="btn btn-primary btn-lg w-100 mt-3" type="submit">Login to Dashboard</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
